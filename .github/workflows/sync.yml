name: Sinkron data Drive MPM

# Menjalankan tools/sync.py secara berkala supaya dashboard ikut memperbarui
# begitu ada berkas/folder baru di Google Drive.
# Syarat: folder Drive dibagikan "Anyone with the link -> Viewer".

on:
  schedule:
    - cron: "0 23 * * *"      # 23:00 UTC = 06:00 WIB setiap hari
  workflow_dispatch:           # bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang openpyxl
        run: pip install openpyxl

      - name: Tarik data dari Google Drive
        run: python tools/sync.py

      - name: Bangun ulang halaman HTML
        run: python tools/build_pages.py

      - name: Simpan perubahan bila ada
        run: |
          git config user.name  "mpm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ *.html
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Sinkron data Drive MPM $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
